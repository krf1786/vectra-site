<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vectra Systems Hover Logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #22d47f;
      --green-hover: #39ff9c;
      --black: #050505;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      font-family: "JetBrains Mono", monospace;
    }

    .vectra-logo {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .vectra-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wordmark {
      font-size: clamp(56px, 10vw, 112px);
      font-weight: 800;
      letter-spacing: -0.08em;
      color: var(--black);
      line-height: 0.9;
      transition:
        filter 0.25s ease,
        transform 0.25s ease;
    }

    .bracket {
      font-size: clamp(64px, 11vw, 124px);
      font-weight: 700;
      color: var(--green);
      line-height: 0.8;
      transition:
        color 0.25s ease,
        text-shadow 0.25s ease,
        transform 0.25s ease;
    }

    .systems {
      margin-top: 12px;
      font-size: clamp(20px, 3vw, 34px);
      font-weight: 400;
      letter-spacing: clamp(10px, 2vw, 22px);
      padding-left: clamp(10px, 2vw, 22px);
      color: var(--green);
      transition:
        color 0.25s ease,
        text-shadow 0.25s ease,
        transform 0.25s ease;
    }

    .coming-soon {
      margin-top: 42px;
      font-size: clamp(13px, 1.7vw, 18px);
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(5, 5, 5, 0.62);
      transition:
        color 0.25s ease,
        letter-spacing 0.25s ease,
        transform 0.25s ease;
    }

    .vectra-logo:hover .bracket,
    .vectra-logo:hover .systems {
      color: var(--green-hover);
      text-shadow:
        0 0 6px rgba(57, 255, 156, 0.95),
        0 0 14px rgba(57, 255, 156, 0.75),
        0 0 30px rgba(57, 255, 156, 0.5),
        0 0 54px rgba(57, 255, 156, 0.35);
    }

    .vectra-logo:hover .wordmark {
      filter: drop-shadow(0 10px 9px rgba(0, 0, 0, 0.38));
      transform: translateY(-2px);
    }

    .vectra-logo:hover .bracket {
      transform: scale(1.03);
    }

    .vectra-logo:hover .systems {
      transform: translateY(2px);
    }

    .vectra-logo:hover .coming-soon {
      color: rgba(5, 5, 5, 0.86);
      letter-spacing: 0.38em;
      transform: translateY(4px);
    }
  </style>
</head>
<body>
  <main class="vectra-logo" aria-label="Vectra Systems logo">
    <div class="vectra-main">
      <span class="bracket">[</span>
      <span class="wordmark">vectra</span>
      <span class="bracket">]</span>
    </div>
    <div class="systems">systems</div>
    <div class="coming-soon">coming soon</div>
  </main>
</body>
</html>
