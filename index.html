      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Vectra Systems",
        "description": "Vectra Systems designs and builds fast, accessible websites for businesses that need more than a template.",

        "image": "https://vectra.systems/social-card.jpg",
        "areaServed": "Worldwide",
        "knowsAbout": [
          "Web design",
          "Web development",
          "E-commerce",
          "Landing pages",
          "Website accessibility",
          "Website performance"
        ],
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Marketing Websites" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "E-commerce" } },

  <body>
    <header class="site-header">
      <a class="wordmark" href="#top" aria-label="Vectra Systems home">
        Vectra<span>Systems</span>
      </a>

      <nav class="site-nav" aria-label="Studio capabilities">
        <span>Strategy</span>
        <span>Design</span>
        <span>Development</span>
      </nav>

      <div class="header-action">
        <span class="system-status"><i></i><span>Taking on new work</span></span>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <span class="hero__rail hero__rail--left" aria-hidden="true">Traditional standards — modern solutions</span>

        <div class="hero__socials" aria-hidden="true">
          <span>STR</span>
          <span>DES</span>
          <span>DEV</span>
        </div>

        <p class="hero__ghost" aria-hidden="true">VECTRA</p>

        <div class="hero__lede">
          <p class="eyebrow"><i></i> What we do</p>
          <h1 id="hero-title">We build beautiful, high-performance websites.</h1>
          <p class="hero__year">EST. 2021</p>
        </div>

        <div class="hero__cta">
          <a
            class="button button--primary"
            href="mailto:hello@vectra.systems?subject=Website%20project%20inquiry"
          >
            Plan a site <span>&rarr;</span>
          </a>
          <a class="watch" href="mailto:hello@vectra.systems">
            <span class="watch__play">@</span>
            <span>hello@vectra.systems</span>
          </a>
        </div>
      </section>
